# Only reachable through the host's loopback binding / existing reverse proxy.
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
    http http;
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-store" always;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $original_scheme;
    proxy_set_header X-Service-Key "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_next_upstream off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }
    location ~ ^/api/auth(?:/|$) {
        set $upstream auth-service:5005;
        proxy_pass http://$upstream$request_uri;
    }
    location ~ ^/api/evenements(?:/|$) {
        set $upstream evenement-service:5001;
        proxy_pass http://$upstream$request_uri;
    }
    location ~ ^/api/(?:budgets|depenses)(?:/|$) {
        set $upstream budget-service:5004;
        proxy_pass http://$upstream$request_uri;
    }
    location ~ ^/api/(?:salles|reservations)(?:/|$) {
        set $upstream salles-service:5242;
        proxy_pass http://$upstream$request_uri;
    }
    location ~ ^/api/(?:prestataires|contrats-prestataire)(?:/|$) {
        set $upstream prestataires-service:5002;
        proxy_pass http://$upstream$request_uri;
    }
    location ^~ /api/v1/ {
        set $upstream invites-service:5003;
        proxy_pass http://$upstream$request_uri;
    }
    location /api/ {
        default_type application/json;
        return 404 '{"message":"Route API introuvable."}';
    }
    location = /api { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
    error_page 502 503 504 =503 @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"message":"Service temporairement indisponible."}';
    }
}

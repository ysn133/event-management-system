openapi: 3.0.3
info:
  title: EventFlow Authentication API
  version: 1.0.0
servers:
  - url: http://localhost:5005
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      summary: Sign in and issue an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 255}
                password: {type: string, minLength: 1, maxLength: 72}
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn, user]
                properties:
                  accessToken: {type: string}
                  tokenType: {type: string, example: Bearer}
                  expiresIn: {type: integer, example: 3600}
                  user: {$ref: '#/components/schemas/User'}
        '400': {description: Invalid input}
        '401': {description: Incorrect credentials}
  /api/auth/me:
    get:
      summary: Read the authenticated user's profile
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {description: Missing, invalid or expired token, or user no longer exists}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, nom]
      properties:
        id: {type: integer, format: int64}
        email: {type: string, format: email}
        nom: {type: string}

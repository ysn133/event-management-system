name: CI invites-service

# Lance les tests du module Invités à chaque Pull Request et à chaque fusion dans main,
# uniquement quand ce module (ou ce fichier) est modifié.
on:
  pull_request:
    paths:
      - "services/module_invites/**"
      - ".github/workflows/invites-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/module_invites/**"
      - ".github/workflows/invites-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: services/module_invites

    # Base PostgreSQL jetable, créée pour ce job puis détruite.
    # Les identifiants ci-dessous ne sont PAS des secrets : ils ne protègent qu'un conteneur éphémère.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: invites_test   # le nom doit contenir « test » (garde-fou de conftest.py)
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d invites_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/invites_test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/module_invites/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests unitaires
        run: pytest -m unit -v

      - name: Tests d'intégration (PostgreSQL réel)
        run: pytest -m integration -v -rs 2>&1 | tee integration.log

      # Un test ignoré (SKIPPED) ne prouve rien : en CI, tout doit réellement s'exécuter.
      - name: Vérifier qu'aucun test d'intégration n'a été ignoré
        run: |
          if grep -q "SKIPPED" integration.log; then
            echo "::error::Des tests d'intégration ont été ignorés (voir le journal ci-dessus)."
            exit 1
          fi

      # Vérifie que l'image Docker du module se construit (elle n'est pas publiée ici).
      - name: Construire l'image Docker
        run: docker build -t invites-service .
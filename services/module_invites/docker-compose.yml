

services:
  db_test:
    image: postgres:18
    container_name: invites_db_test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Définissez POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: invites_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d invites_test"]
      interval: 5s
      timeout: 3s
      retries: 10

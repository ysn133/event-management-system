spring:
  application:
    name: auth-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:5005}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:eventflow}
    ttl-seconds: 3600

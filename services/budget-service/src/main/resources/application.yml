spring:
  application:
    name: budget-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${PORT:5004}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

integrations:
  providers:
    mode: ${PROVIDERS_INTEGRATION_MODE:http}
    base-url: ${PROVIDER_SERVICE_URL:http://localhost:5002}
  events:
    mode: ${EVENTS_VALIDATION_MODE:http}
    base-url: ${EVENT_SERVICE_URL:http://localhost:5001}
  rooms:
    mode: ${ROOMS_INTEGRATION_MODE:http}
    base-url: ${ROOM_SERVICE_URL:http://localhost:5242}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:eventflow}

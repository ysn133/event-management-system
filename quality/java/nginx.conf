server {
  listen 127.0.0.1:46380;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Service-Key "";
  proxy_next_upstream off;
  location = /health { default_type application/json; return 200 '{"status":"ok","service":"quality-gateway"}'; }
  location /api/auth { proxy_pass http://127.0.0.1:46355; }
  location /api/evenements { proxy_pass http://127.0.0.1:46351; }
  location ~ ^/api/(budgets|depenses)(/|$) { proxy_pass http://127.0.0.1:46354; }
  # Explicit test doubles for non-Java domains, NOT evidence of their validation.
  location /api/ { proxy_pass http://127.0.0.1:46360; }
  location /quality-reports/ { alias /quality-reports/; autoindex on; }
  location / { try_files $uri $uri/ /index.html; }
}
